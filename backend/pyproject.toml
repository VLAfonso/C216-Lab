[project]
name = "backend"
version = "0.1.0"
description = "Projeto de uma Loja de Brinquedos, sendo possível cadastrar brinquedos e contendo as informações: nome, descrição, preço, categoria, marca, faixa etária e quantidade."
authors = [
    {name = "Virgínia Letícia Afonso",email = "vlafonso@hotmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "httpx2 (>=2.16.2,<3.0.0)"
]


[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (erros de sintaxe e imports não usados)
    "I",    # isort (ordenação automática e padronizada de imports)
    "UP",   # pyupgrade (garante sintaxe moderna de Python 3.12+)
    "B",    # flake8-bugbear (pega bugs comuns)
]
ignore = []